apply plugin: 'com.android.library'

group = 'expo.modules.ehcnfc'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.ehcnfc"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    viewBinding = true
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
    sourceSets {
      test {
        resources.srcDir("$projectDir/../TestResources")
      }
    }
  }
}

repositories {
  mavenCentral() // <-- important
}

dependencies {
  implementation("com.facebook.react:react-native:+")
  implementation("at.asitplus.signum:indispensable-asn1:3.16.3") {
    exclude group: "org.bouncycastle", module: "bcpkix-jdk18on"
    exclude group: "org.bouncycastle", module: "bcutil-jdk18on"
    exclude group: "org.bouncycastle", module: "bcprov-jdk18on"
    exclude group: "org.bouncycastle", module: "bcpkix-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcutil-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
  }

  implementation("at.asitplus.signum:supreme:0.8.3") {
    exclude group: "org.bouncycastle", module: "bcpkix-jdk18on"
    exclude group: "org.bouncycastle", module: "bcutil-jdk18on"
    exclude group: "org.bouncycastle", module: "bcprov-jdk18on"
    exclude group: "org.bouncycastle", module: "bcpkix-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcutil-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
  }

  implementation("org.bouncycastle:bcprov-jdk15to18:1.78.1")
  
  implementation("com.google.android.material:material:1.12.0")
  implementation("com.google.code.gson:gson:2.10.1")
  testImplementation("junit:junit:4.13.2")
  testImplementation("org.jetbrains.kotlin:kotlin-test:1.9.0")
}

tasks.withType(Test).configureEach {
  testLogging {
    events "PASSED", "FAILED", "SKIPPED"
    exceptionFormat "full"  // shows stack traces
    showStandardStreams = true // also prints println/logs from tests
  }
}